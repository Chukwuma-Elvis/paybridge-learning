spring:
  application:
    name: paybridge
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

paybridge:
  dev:
    # TEST SCAFFOLDING: lets you put test naira into an account. Set to false anywhere but your own machine.
    funding-enabled: true
  account:
    # Fictional 3-digit bank code used to compute the NUBAN check digit. Not a real bank.
    bank-code: "999"
  compliance:
    # Transfer limits per KYC tier, in kobo (100 kobo = 1 naira). Placeholder figures for learning.
    limits:
      UNVERIFIED:
        per-transaction-minor: 5000000     # NGN 50,000
        daily-minor: 10000000              # NGN 100,000
      BASIC:
        per-transaction-minor: 20000000    # NGN 200,000
        daily-minor: 50000000              # NGN 500,000
      FULL:
        per-transaction-minor: 500000000   # NGN 5,000,000
        daily-minor: 1000000000            # NGN 10,000,000
